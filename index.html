<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Blue vs Red</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    touch-action: none;
}

body {
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: monospace;
}

/* ================= MENU ================= */

#menu {
    position: fixed;
    inset: 0;
    z-index: 1000;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: #151515;
    color: white;
}

#menu h1 {
    font-size: 42px;
    text-align: center;
}

#menu p {
    font-size: 20px;
}

#start {
    padding: 18px 45px;
    margin-top: 20px;

    background: #159447;
    color: white;

    border: 4px solid white;
    border-radius: 10px;

    font-size: 24px;
    font-family: monospace;
}

/* ================= JOGO ================= */

#game {
    display: none;

    position: fixed;
    inset: 0;

    background: #65b9e5;
}

/* ================= VIDA ================= */

.healthBox {
    position: absolute;
    top: 20px;

    width: 35%;
    height: 32px;

    background: #222;
    border: 4px solid white;

    z-index: 50;
}

#blueHealthBox {
    left: 4%;
}

#redHealthBox {
    right: 4%;
}

#blueHealth,
#redHealth {
    height: 100%;
    width: 100%;
}

#blueHealth {
    background: #008cff;
}

#redHealth {
    background: #ff2020;
}

/* ================= ARENA ================= */

#arena {
    position: absolute;

    left: 4%;
    right: 4%;

    top: 14%;
    bottom: 27%;

    overflow: hidden;

    border: 5px solid #222;

    background:
    linear-gradient(
        #73c5ec 0%,
        #73c5ec 65%,
        #59a63d 65%,
        #59a63d 100%
    );
}

/* ================= JOGADORES ================= */

.player {
    position: absolute;

    width: 55px;
    height: 55px;

    border-radius: 50%;

    border: 5px solid #111;
}

#blue {
    background: #008cff;

    left: 15%;
    top: 50%;
}

#red {
    background: #ff2020;

    left: 80%;
    top: 50%;
}

/* ================= BOTÕES DE CONTROLE ================= */

/*
   CONTROLE AZUL
*/

#blueControls {
    position: absolute;

    left: 25px;
    bottom: 20px;

    width: 140px;
    height: 210px;

    z-index: 100;
}

/*
   CONTROLE VERMELHO
*/

#redControls {
    position: absolute;

    right: 25px;
    bottom: 20px;

    width: 140px;
    height: 210px;

    z-index: 100;
}

/* ================= ATAQUE ================= */

/*
   Agora o ataque fica
   EM CIMA do joystick.
*/

.attack {
    position: absolute;

    top: 0;

    width: 75px;
    height: 75px;

    border-radius: 50%;

    border: 4px solid white;

    color: white;

    font-size: 28px;

    z-index: 110;
}

#blueAttack {
    left: 32px;
    background: #087cff;
}

#redAttack {
    left: 32px;
    background: #e71919;
}

/* ================= JOYSTICK ================= */

.joystick {
    position: absolute;

    left: 7px;
    bottom: 0;

    width: 125px;
    height: 125px;

    border-radius: 50%;

    background: rgba(40,40,40,0.85);

    border: 5px solid #aaa;

    touch-action: none;
}

.stick {
    position: absolute;

    width: 55px;
    height: 55px;

    left: 30px;
    top: 30px;

    border-radius: 50%;

    background: #999;

    border: 4px solid white;

    pointer-events: none;
}

/* ================= PAUSA ================= */

#pauseButton,
#restartButton {
    position: absolute;

    top: 65px;

    z-index: 200;

    padding: 10px 18px;

    border: 3px solid white;
    border-radius: 8px;

    color: white;

    font-family: monospace;
    font-size: 18px;
}

#pauseButton {
    left: 50%;

    transform: translateX(-110%);

    background: #555;
}

#restartButton {
    left: 50%;

    transform: translateX(10%);

    background: #b52a2a;
}

/* ================= PAUSADO ================= */

#pauseScreen {
    display: none;

    position: absolute;

    inset: 0;

    z-index: 300;

    background: rgba(0,0,0,0.65);

    justify-content: center;
    align-items: center;

    color: white;

    font-size: 45px;
}

/* ================= VITÓRIA ================= */

#message {
    display: none;

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    padding: 25px;

    background: #111;

    color: white;

    border: 5px solid white;

    font-size: 35px;

    text-align: center;

    z-index: 500;
}

</style>
</head>

<body>


<!-- ================= MENU ================= -->

<div id="menu">

    <h1>🔵 BLUE VS RED 🔴</h1>

    <p>Jogo de luta 2D</p>

    <p>Créditos: <b>Raphael</b></p>

    <button id="start">
        ▶ COMEÇAR JOGO
    </button>

</div>


<!-- ================= JOGO ================= -->

<div id="game">


    <!-- VIDA -->

    <div id="blueHealthBox" class="healthBox">
        <div id="blueHealth"></div>
    </div>

    <div id="redHealthBox" class="healthBox">
        <div id="redHealth"></div>
    </div>


    <!-- PAUSA -->

    <button id="pauseButton">
        ⏸ PAUSAR
    </button>

    <button id="restartButton">
        🔄 REINICIAR
    </button>


    <!-- ARENA -->

    <div id="arena">

        <div id="blue" class="player"></div>

        <div id="red" class="player"></div>

        <div id="message"></div>

    </div>


    <!-- ================= CONTROLE AZUL ================= -->

    <div id="blueControls">

        <!-- ATAQUE AZUL EM CIMA -->

        <button id="blueAttack" class="attack">
            👊
        </button>

        <!-- JOYSTICK AZUL -->

        <div id="blueJoystick" class="joystick">

            <div class="stick"></div>

        </div>

    </div>


    <!-- ================= CONTROLE VERMELHO ================= -->

    <div id="redControls">

        <!-- ATAQUE VERMELHO EM CIMA -->

        <button id="redAttack" class="attack">
            👊
        </button>

        <!-- JOYSTICK VERMELHO -->

        <div id="redJoystick" class="joystick">

            <div class="stick"></div>

        </div>

    </div>


    <!-- TELA DE PAUSA -->

    <div id="pauseScreen">
        ⏸ PAUSADO
    </div>

</div>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const menu = document.getElementById("menu");
const game = document.getElementById("game");

const startButton =
document.getElementById("start");

const pauseButton =
document.getElementById("pauseButton");

const restartButton =
document.getElementById("restartButton");

const pauseScreen =
document.getElementById("pauseScreen");

const blue =
document.getElementById("blue");

const red =
document.getElementById("red");

const blueHealth =
document.getElementById("blueHealth");

const redHealth =
document.getElementById("redHealth");

const message =
document.getElementById("message");


/* =====================================================
   ESTADO
===================================================== */

let playing = false;

let paused = false;


/* VIDA */

let blueHP = 100;
let redHP = 100;


/* POSIÇÕES */

let blueX = 15;
let blueY = 50;

let redX = 80;
let redY = 50;


/* VELOCIDADE */

const SPEED = 0.9;


/* =====================================================
   COMEÇAR
===================================================== */

startButton.addEventListener("click", function() {

    menu.style.display = "none";

    game.style.display = "block";

    playing = true;

    paused = false;

    update();

});


/* =====================================================
   PAUSAR
===================================================== */

pauseButton.addEventListener("click", function() {

    if (!playing)
        return;


    paused = !paused;


    if (paused) {

        pauseButton.textContent =
            "▶ CONTINUAR";

        pauseScreen.style.display =
            "flex";

    }

    else {

        pauseButton.textContent =
            "⏸ PAUSAR";

        pauseScreen.style.display =
            "none";

    }

});


/* =====================================================
   REINICIAR
===================================================== */

restartButton.addEventListener("click", function() {

    blueHP = 100;
    redHP = 100;


    blueX = 15;
    blueY = 50;


    redX = 80;
    redY = 50;


    playing = true;

    paused = false;


    blueHealth.style.width =
        "100%";

    redHealth.style.width =
        "100%";


    message.style.display =
        "none";


    pauseScreen.style.display =
        "none";


    pauseButton.textContent =
        "⏸ PAUSAR";


    update();

});


/* =====================================================
   ATUALIZAR
===================================================== */

function update() {

    blue.style.left =
        blueX + "%";

    blue.style.top =
        blueY + "%";


    red.style.left =
        redX + "%";

    red.style.top =
        redY + "%";

}


/* =====================================================
   LIMITES
===================================================== */

function limit() {

    blueX =
        Math.max(2, Math.min(94, blueX));

    blueY =
        Math.max(2, Math.min(88, blueY));


    redX =
        Math.max(2, Math.min(94, redX));

    redY =
        Math.max(2, Math.min(88, redY));

}


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener("keydown", function(event) {

    if (!playing || paused)
        return;


    const key =
        event.key.toLowerCase();


    /* AZUL */

    if (key === "w")
        blueY -= SPEED;

    if (key === "s")
        blueY += SPEED;

    if (key === "a")
        blueX -= SPEED;

    if (key === "d")
        blueX += SPEED;


    /* VERMELHO */

    if (event.key === "ArrowUp")
        redY -= SPEED;

    if (event.key === "ArrowDown")
        redY += SPEED;

    if (event.key === "ArrowLeft")
        redX -= SPEED;

    if (event.key === "ArrowRight")
        redX += SPEED;


    limit();

    update();

});


/* =====================================================
   DISTÂNCIA
===================================================== */

function distance() {

    return Math.sqrt(

        Math.pow(
            blueX - redX,
            2
        )

        +

        Math.pow(
            blueY - redY,
            2
        )

    );

}


/* =====================================================
   SOCO
===================================================== */

function punch(player) {

    if (!playing || paused)
        return;


    if (distance() > 14)
        return;


    /* ================= AZUL ================= */

    if (player === "blue") {

        redHP -= 10;


        if (redHP < 0)
            redHP = 0;


        redHealth.style.width =
            redHP + "%";


        /*
           EMPURRAR VERMELHO
        */

        let dx =
            redX - blueX;

        let dy =
            redY - blueY;


        let length =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (length > 0) {

            dx /= length;
            dy /= length;

        }


        redX += dx * 10;
        redY += dy * 5;

    }


    /* ================= VERMELHO ================= */

    if (player === "red") {

        blueHP -= 10;


        if (blueHP < 0)
            blueHP = 0;


        blueHealth.style.width =
            blueHP + "%";


        /*
           EMPURRAR AZUL
        */

        let dx =
            blueX - redX;

        let dy =
            blueY - redY;


        let length =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (length > 0) {

            dx /= length;
            dy /= length;

        }


        blueX += dx * 10;
        blueY += dy * 5;

    }


    limit();

    update();

    winner();

}


/* =====================================================
   BOTÕES DE ATAQUE
===================================================== */

document.getElementById("blueAttack")
.addEventListener("pointerdown", function(event) {

    event.preventDefault();

    punch("blue");

});


document.getElementById("redAttack")
.addEventListener("pointerdown", function(event) {

    event.preventDefault();

    punch("red");

});


/* =====================================================
   JOYSTICK
===================================================== */

function createJoystick(id, player) {

    const joystick =
        document.getElementById(id);

    const stick =
        joystick.querySelector(".stick");


    let dragging = false;

    let pointerID = null;


    joystick.addEventListener(
        "pointerdown",
        function(event) {

            if (!playing || paused)
                return;


            dragging = true;

            pointerID =
                event.pointerId;


            joystick.setPointerCapture(
                pointerID
            );


            move(event);

        }
    );


    joystick.addEventListener(
        "pointermove",
        function(event) {

            if (!dragging)
                return;


            if (event.pointerId !== pointerID)
                return;


            if (paused)
                return;


            move(event);

        }
    );


    joystick.addEventListener(
        "pointerup",
        release
    );


    joystick.addEventListener(
        "pointercancel",
        release
    );


    function release() {

        dragging = false;

        pointerID = null;


        stick.style.transform =
            "translate(0,0)";

    }


    function move(event) {

        const rect =
            joystick.getBoundingClientRect();


        const centerX =
            rect.left +
            rect.width / 2;


        const centerY =
            rect.top +
            rect.height / 2;


        let dx =
            event.clientX -
            centerX;


        let dy =
            event.clientY -
            centerY;


        const dist =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        const max = 38;


        if (dist > max) {

            dx =
                dx / dist * max;

            dy =
                dy / dist * max;

        }


        /*
           Movimento visual
        */

        stick.style.transform =
            "translate(" +
            dx +
            "px," +
            dy +
            "px)";


        /*
           Movimento do personagem
        */

        if (Math.abs(dx) > 3) {

            if (player === "blue")
                blueX +=
                    (dx / max) *
                    SPEED;

            if (player === "red")
                redX +=
                    (dx / max) *
                    SPEED;

        }


        if (Math.abs(dy) > 3) {

            if (player === "blue")
                blueY +=
                    (dy / max) *
                    SPEED;

            if (player === "red")
                redY +=
                    (dy / max) *
                    SPEED;

        }


        limit();

        update();

    }

}


/* =====================================================
   CRIAR JOYSTICKS
===================================================== */

createJoystick(
    "blueJoystick",
    "blue"
);


createJoystick(
    "redJoystick",
    "red"
);


/* =====================================================
   VENCEDOR
===================================================== */

function winner() {

    if (blueHP <= 0) {

        playing = false;

        message.textContent =
            "🔴 RED VENCEU!";

        message.style.display =
            "block";

    }


    if (redHP <= 0) {

        playing = false;

        message.textContent =
            "🔵 BLUE VENCEU!";

        message.style.display =
            "block";

    }

}


/* =====================================================
   INICIAL
===================================================== */

update();

</script>

</body>
</html>
